<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Psyche · 五维综合测试</title>
    <style>
      :root {
        --bg: #050816;
        --panel: rgba(9, 18, 42, 0.82);
        --line: rgba(60, 230, 255, 0.45);
        --cyan: #5ef2ff;
        --pink: #ff53c2;
        --text: #e8f8ff;
        --muted: #85a3bf;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(255, 83, 194, 0.22), transparent 26%),
          radial-gradient(circle at top right, rgba(94, 242, 255, 0.22), transparent 24%),
          linear-gradient(135deg, #02050c, #081224 55%, #030711);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
      }

      .app { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
      .shell {
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow:
          0 0 0 1px rgba(94, 242, 255, 0.12),
          0 0 30px rgba(94, 242, 255, 0.14),
          0 0 60px rgba(255, 83, 194, 0.1);
        border-radius: 20px;
        padding: 20px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--cyan);
        margin-bottom: 10px;
      }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 42px); line-height: 1.1; }
      h2 { margin: 0 0 12px; font-size: clamp(20px, 3vw, 28px); }
      p { color: var(--text); line-height: 1.65; }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 10px; }
      .option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(94, 242, 255, 0.25);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        cursor: pointer;
      }
      .option:hover { transform: translateY(-1px); border-color: var(--cyan); }
      .primary {
        background: linear-gradient(90deg, rgba(94, 242, 255, 0.24), rgba(255, 83, 194, 0.24));
        border: 1px solid rgba(94, 242, 255, 0.7);
      }
      .result-card {
        background: linear-gradient(180deg, rgba(94, 242, 255, 0.08), rgba(255, 83, 194, 0.08));
        border: 1px solid rgba(94, 242, 255, 0.4);
        border-radius: 16px;
        padding: 18px;
      }
      .score-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(94, 242, 255, 0.2);
      }
      .score-row:last-child { border-bottom: none; }
      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(94, 242, 255, 0.12);
        color: var(--cyan);
        font-size: 12px;
      }
      @media (max-width: 640px) {
        .app { padding: 14px 10px 32px; }
        .shell { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="root"></div>
    </div>

    <script>
      const dims = [
        { key: 'cognitive', title: '认知节奏', desc: '你对复杂信息的处理方式' },
        { key: 'emotion', title: '情绪韧性', desc: '你面对压力时的稳定度' },
        { key: 'decision', title: '决策效率', desc: '你在选择上的速度和策略' },
        { key: 'social', title: '社交影响', desc: '你在关系中的互动模式' },
        { key: 'adapt', title: '适应力', desc: '你对变化的承受与重建能力' },
      ];

      const questions = [
        { dim: 'cognitive', text: '复杂任务开始前，你通常会先做哪一步？', options: ['把任务拆成小步骤', '先看整体框架', '直接开始做', '找熟悉的方法'] },
        { dim: 'cognitive', text: '信息很多时，你更容易？', options: ['先按优先级筛选', '先记关键词', '抓显眼内容', '找关系图'] },
        { dim: 'cognitive', text: '你更喜欢哪种指令方式？', options: ['步骤清单', '目标说明', '一句话简述', '场景化描述'] },
        { dim: 'cognitive', text: '面对新领域，你会？', options: ['先查资料建立基础', '先试一下再调整', '找人问具体做法', '看别人案例'] },
        { dim: 'cognitive', text: '学习新技能时，你先重视？', options: ['基础概念', '实际操作', '学习效率', '案例示范'] },
        { dim: 'cognitive', text: '遇到模糊信息，你倾向于？', options: ['先标出模糊点', '直接猜一个解释', '收集更多例子', '从经验联想'] },
        { dim: 'cognitive', text: '做决定前，你更愿意？', options: ['罗列利弊', '先确认目标', '看时间紧迫度', '听他人反馈'] },
        { dim: 'cognitive', text: '你更容易接受哪种反馈？', options: ['具体事实反馈', '情绪提醒', '结果对比', '细节建议'] },
        { dim: 'cognitive', text: '处理任务时，你最看重？', options: ['准确率', '完成度', '效率', '可复制性'] },
        { dim: 'cognitive', text: '任务突然变复杂，你会？', options: ['重新规划', '更快行动', '问清目标边界', '观察别人做法'] },

        { dim: 'emotion', text: '压力很大时，你更可能？', options: ['停下来调整节奏', '把任务拆小', '继续推进', '找人说说'] },
        { dim: 'emotion', text: '别人情绪变化会影响你吗？', options: ['有一点，但先观察', '会，被带走', '较少影响', '会，我会试着安抚'] },
        { dim: 'emotion', text: '计划被打断，你会？', options: ['先稳定心态后换方案', '立即处理冲突', '补救进度', '先看是否可接受'] },
        { dim: 'emotion', text: '你在挫败面前，更可能说？', options: ['我需要一点调整', '我可以再试一次', '这次很糟糕', '我先看看别人怎么做'] },
        { dim: 'emotion', text: '情绪低落时，你倾向于？', options: ['静下来观察自己', '找人倾诉', '去做点事', '独处'] },
        { dim: 'emotion', text: '你不喜欢哪种状态？', options: ['失控感', '无目标感', '被动等待', '被否定感'] },
        { dim: 'emotion', text: '面对误会，你会？', options: ['先解释清楚', '先确认感受', '先不急着回应', '先维持关系'] },
        { dim: 'emotion', text: '你对自己情绪的觉察程度？', options: ['很高', '一般', '较低', '中等偏高'] },
        { dim: 'emotion', text: '失望后，你更愿意？', options: ['重新编排目标', '再给自己一次机会', '先暂停再说', '分析哪里出了问题'] },
        { dim: 'emotion', text: '你更容易被哪种外界刺激影响？', options: ['他人的语气', '节奏过快的环境', '不确定信息', '无结果等待'] },

        { dim: 'decision', text: '做重大选择时，你通常先看？', options: ['风险和成本', '时间窗口', '预期收益', '是否符合价值'] },
        { dim: 'decision', text: '不确定时，你更会？', options: ['先做小试验', '先收集更多信息', '先选能推进方案', '等待更合适时机'] },
        { dim: 'decision', text: '你对“快”和“稳”的偏好是？', options: ['更重视稳', '更重视快', '两者都重要', '看情况'] },
        { dim: 'decision', text: '哪种情境最容易让你犹豫？', options: ['信息太多', '价值冲突', '别人意见太多', '结果不可逆'] },
        { dim: 'decision', text: '你在重要事项上更像？', options: ['反复比较', '快速定夺', '独立推进', '先找共识'] },
        { dim: 'decision', text: '你更在意决策的？', options: ['长期效益', '当下结果', '风险控制', '可行性'] },
        { dim: 'decision', text: '做错选择后，你会？', options: ['马上调整', '先接受再复盘', '先抱怨一下', '总结教训后再动'] },
        { dim: 'decision', text: '你更喜欢哪种领导方式？', options: ['清晰目标+步骤', '鼓励尝试', '稳住风险', '提供支持和共创'] },
        { dim: 'decision', text: '你怎么看“试错”？', options: ['必要成本', '破坏效率', '要控制范围', '不喜欢'] },
        { dim: 'decision', text: '做关键选择时，你通常偏向？', options: ['理性分析', '经验判断', '情绪感受', '场景判断'] },

        { dim: 'social', text: '你在团队中更容易扮演什么角色？', options: ['推进者', '观察者', '协调者', '鼓励者'] },
        { dim: 'social', text: '别人强烈表达观点时，你最可能？', options: ['先整理再回应', '马上表达己见', '先让气氛缓下来', '找共同点'] },
        { dim: 'social', text: '你在社交场合里更偏向？', options: ['主动开场', '先观察再决定', '只和熟人说', '以服务为主'] },
        { dim: 'social', text: '别人找你帮忙时，你更希望对方？', options: ['具体说明需求', '说明情绪状态', '给你自己想的空间', '说明边界'] },
        { dim: 'social', text: '你最重视别人对你的评价里哪部分？', options: ['能力', '靠谱度', '情绪安全感', '亲和度'] },
        { dim: 'social', text: '和别人意见不一致时，你倾向于？', options: ['换角度重述', '先保持关系', '用事实说服', '先停下来放轻松'] },
        { dim: 'social', text: '你的影响力通常来自？', options: ['逻辑表达清晰', '情绪陪伴', '行动成果', '耐心倾听'] },
        { dim: 'social', text: '在团队冲突里，你更可能？', options: ['调停', '中立观察', '强势推动', '先关怀'] },
        { dim: 'social', text: '你更希望被别人看作？', options: ['可靠的人', '有趣的人', '有能力的人', '懂人情的人'] },
        { dim: 'social', text: '建立信任时，你更倾向于？', options: ['按时跟进', '真诚倾听', '给对方空间', '帮助解决实际问题'] },

        { dim: 'adapt', text: '环境突然变化时，你更容易？', options: ['快速更新计划', '先确认变化内容', '先反应再思考', '找更稳定参考'] },
        { dim: 'adapt', text: '临时变化时，你更能接受？', options: ['明确新安排', '减少信息量', '给点缓冲时间', '允许试错'] },
        { dim: 'adapt', text: '新环境里，你的适应方式更像？', options: ['先观察再行动', '先参与再总结', '先找人帮忙', '先自己找规则'] },
        { dim: 'adapt', text: '你对“不确定性”的容忍度？', options: ['中等偏低', '中等', '中等偏高', '很高'] },
        { dim: 'adapt', text: '面对突发情况，你更愿意？', options: ['做临时方案', '先稳住情绪', '先找熟悉规则', '找人分担'] },
        { dim: 'adapt', text: '你认为自己在变化中更像？', options: ['适应者', '守住核心', '灵活重建者', '前置准备者'] },
        { dim: 'adapt', text: '目标突然变了，你会？', options: ['重新拆分目标', '确认是否坚持', '先调研再决策', '先看影响面'] },
        { dim: 'adapt', text: '你更容易对哪类变化产生压力？', options: ['节奏突然加快', '规则突然改变', '人突然离开', '目标模糊'] },
        { dim: 'adapt', text: '流程出现意外，你更想？', options: ['留替代路径', '保证结果稳定', '讲清变化原因', '给自己缓冲时间'] },
        { dim: 'adapt', text: '面对未知环境，你更像？', options: ['先找可靠信息', '先看局势', '先动手试一下', '找熟人协作'] }
      ];

      const state = {
        mode: 'home',
        current: 0,
        answers: [],
        scores: { cognitive: 0, emotion: 0, decision: 0, social: 0, adapt: 0 },
        shareText: '',
      };

      function encodeShare(scores) {
        return btoa(encodeURIComponent(JSON.stringify(scores)));
      }

      function decodeShare(text) {
        try {
          return JSON.parse(decodeURIComponent(atob(text)));
        } catch {
          return null;
        }
      }

      function getDimLabel(value) {
        if (value >= 80) return '强';
        if (value >= 60) return '稳';
        if (value >= 40) return '平衡';
        return '需支持';
      }

      function getSummary(scores) {
        const parts = [];
        dims.forEach((dim) => {
          const value = scores[dim.key];
          const label = getDimLabel(value);
          parts.push(`${dim.title}：${label}（${value}分）`);
        });
        return parts.join('；');
      }

      function renderHome() {
        root.innerHTML = `
          <div class="shell">
            <div class="eyebrow">Cyber Psyche</div>
            <h1>赛博精神扫描</h1>
            <p>
              这是一个基于五个维度的综合测试：认知节奏、情绪韧性、决策效率、社交影响、适应力。  
              题目具体、易懂、可直接选择。完成后会给你一份清晰的五维总结。
            </p>
            <div style="margin-top: 20px;" class="grid">
              <button id="startBtn" class="primary">开始测试</button>
            </div>
          </div>
        `;

        document.getElementById('startBtn').onclick = () => {
          state.mode = 'quiz';
          render();
        };
      }

      function renderQuestion() {
        const q = questions[state.current];
        if (!q) return;

        root.innerHTML = `
          <div class="shell">
            <div class="eyebrow">五维综合测试</div>
            <h1>Cyber Psyche</h1>
            <p class="muted">第 ${state.current + 1} / ${questions.length} 题</p>
            <h2>${q.text}</h2>
            <div class="grid">
              ${q.options.map((option, index) => `
                <button class="option" data-value="${index}">${option}</button>
              `).join('')}
            </div>
          </div>
        `;

        root.querySelectorAll('[data-value]').forEach((btn) => {
          btn.onclick = () => {
            const value = Number(btn.getAttribute('data-value'));
            const qDim = questions[state.current].dim;
            state.answers.push(value);
            state.scores[qDim] += value + 1;

            if (state.current < questions.length - 1) {
              state.current += 1;
              renderQuestion();
            } else {
              const scorePayload = encodeShare(state.scores);
              const url = new URL(window.location.href);
              url.searchParams.set('share', scorePayload);
              window.history.replaceState({}, '', url);
              state.mode = 'results';
              state.shareText = scorePayload;
              render();
            }
          };
        });
      }

      function renderResults() {
        const result = state.shareText ? decodeShare(state.shareText) : state.scores;
        if (!result) return;

        const rows = dims.map((dim) => {
          const value = result[dim.key];
          return `
            <div class="score-row">
              <div>
                <div class="pill">${dim.title}</div>
                <div class="muted" style="margin-top:6px;">${dim.desc}</div>
              </div>
              <div><strong>${value}分</strong></div>
            </div>
          `;
        }).join('');

        const summary = getSummary(result);

        root.innerHTML = `
          <div class="shell">
            <div class="eyebrow">赛博精神扫描结果</div>
            <h1>你的五维综合画像</h1>
            <div class="result-card">
              <p>${summary}</p>
            </div>

            <div style="margin-top: 18px;">
              ${rows}
            </div>

            <div style="margin-top: 20px;" class="grid">
              <button id="shareBtn" class="primary">分享结果</button>
              <button id="restartBtn">重新测试</button>
            </div>
          </div>
        `;

        document.getElementById('shareBtn').onclick = async () => {
          const shareData = {
            title: 'Cyber Psyche',
            text: '我的五维综合测试结果',
            url: `${location.origin}${location.pathname}?share=${encodeShare(result)}`
          };
          try {
            if (navigator.share) {
              await navigator.share(shareData);
            } else if (navigator.clipboard) {
              await navigator.clipboard.writeText(shareData.url);
              alert('链接已复制');
            }
          } catch {}
        };

        document.getElementById('restartBtn').onclick = () => {
          state.mode = 'home';
          state.current = 0;
          state.answers = [];
          state.scores = { cognitive: 0, emotion: 0, decision: 0, social: 0, adapt: 0 };
          state.shareText = '';
          const url = new URL(window.location.href);
          url.searchParams.delete('share');
          window.history.replaceState({}, '', url);
          render();
        };
      }

      function render() {
        const query = new URLSearchParams(window.location.search);
        const share = query.get('share');

        if (share) {
          state.mode = 'results';
          state.shareText = share;
          renderResults();
          return;
        }

        if (state.mode === 'home') {
          renderHome();
          return;
        }

        if (state.mode === 'quiz') {
          renderQuestion();
          return;
        }

        if (state.mode === 'results') {
          renderResults();
          return;
        }
      }

      render();
    </script>
  </body>
</html>
